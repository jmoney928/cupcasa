<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Cupcasa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #2C1A0E;
      --dark: #1A0D07;
      --lime: #C4874A;
      --lime-hover: #AE7038;
      --cream: #FDF5EC;
      --grey-light: #F0E6DA;
      --border: #DDD0BF;
      --text: #3A2010;
      --text-muted: #7A5230;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--cream);
      font-family: 'Open Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .logo-wrap { margin-bottom: 2rem; text-align: center; }
    .logo-wrap img { height: 50px; width: auto; }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.7rem 1rem;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active { color: var(--lime); border-bottom-color: var(--lime); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--cream);
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }
    input:focus { border-color: var(--lime); background: #fff; }

    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      background: var(--lime);
      border: 2px solid var(--lime);
      border-radius: 2px;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dark);
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.25rem;
    }
    .btn-primary:hover { background: var(--lime-hover); border-color: var(--lime-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-ghost {
      width: 100%;
      padding: 0.85rem;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--lime); color: var(--lime); }

    .alert {
      padding: 0.85rem 1rem;
      border-radius: 2px;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .alert-error { background: #fdf0ec; border: 1px solid #e4b5a5; color: #8b2c1a; }
    .alert-success { background: #f0fdf4; border: 1px solid #a3d9a5; color: #1a5c2a; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--lime); }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <a href="/"><img src="/img/casalogo.png" alt="Cupcasa"></a>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="signin">Sign In</button>
      <button class="tab-btn" data-tab="signup">Create Account</button>
    </div>

    <div id="msg"></div>

    <!-- SIGN IN -->
    <div class="tab-panel active" id="panel-signin">
      <form id="form-signin">
        <div class="form-group">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="you@yourbusiness.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="btn-signin">Sign In</button>
      </form>

      <div class="divider">or</div>

      <form id="form-magic">
        <div class="form-group">
          <label for="magic-email">Send a magic link instead</label>
          <input type="email" id="magic-email" placeholder="you@yourbusiness.com" autocomplete="email">
        </div>
        <button type="submit" class="btn-ghost">Email Me a Sign-In Link</button>
      </form>
    </div>

    <!-- SIGN UP -->
    <div class="tab-panel" id="panel-signup">
      <form id="form-signup">
        <div class="form-group">
          <label for="signup-name">Your Name</label>
          <input type="text" id="signup-name" placeholder="Jane Smith" required>
        </div>
        <div class="form-group">
          <label for="signup-business">Business Name</label>
          <input type="text" id="signup-business" placeholder="The Coffee Collective">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@yourbusiness.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn-primary" id="btn-signup">Create Account</button>
      </form>
    </div>
  </div>

  <a href="/" class="back-link">← Back to cupcasa.com</a>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from './js/config.js';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already signed in, skip this page entirely
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.replace('/portal/dashboard');

    // ── Helpers ─────────────────────────────────────────────────────
    function showMsg(text, type = 'error') {
      document.getElementById('msg').innerHTML =
        `<div class="alert alert-${type}">${text}</div>`;
    }
    function clearMsg() { document.getElementById('msg').innerHTML = ''; }

    // After sign-in, ensure the customer row exists (created on first login).
    // RLS lets users insert/select only their own row, so this is safe client-side.
    async function ensureCustomer(user, extra = {}) {
      const { data } = await supabase
        .from('customers')
        .select('id')
        .eq('id', user.id)
        .maybeSingle();
      if (!data) {
        await supabase.from('customers').insert({
          id: user.id,
          email: user.email,
          name: extra.name || user.user_metadata?.name || '',
          business_name: extra.business_name || user.user_metadata?.business_name || '',
        });
      }
    }

    // ── Tab switching ────────────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        clearMsg();
      });
    });

    // ── Sign In ──────────────────────────────────────────────────────
    document.getElementById('form-signin').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-signin');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      clearMsg();

      const { data, error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('signin-email').value.trim(),
        password: document.getElementById('signin-password').value,
      });

      if (error) {
        showMsg(error.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      await ensureCustomer(data.user);
      window.location.replace('/portal/dashboard');
    });

    // ── Magic Link ───────────────────────────────────────────────────
    document.getElementById('form-magic').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const email = document.getElementById('magic-email').value.trim();
      if (!email) { showMsg('Enter your email address above.'); return; }
      btn.disabled = true;
      btn.textContent = 'Sending…';
      clearMsg();

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: 'https://cupcasa.com/portal/dashboard' },
      });

      if (error) {
        showMsg(error.message);
        btn.disabled = false;
        btn.textContent = 'Email Me a Sign-In Link';
        return;
      }
      showMsg('Link sent — check your inbox. You can close this tab.', 'success');
    });

    // ── Sign Up ──────────────────────────────────────────────────────
    document.getElementById('form-signup').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-signup');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      clearMsg();

      const name         = document.getElementById('signup-name').value.trim();
      const businessName = document.getElementById('signup-business').value.trim();
      const email        = document.getElementById('signup-email').value.trim();
      const password     = document.getElementById('signup-password').value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { name, business_name: businessName },
          emailRedirectTo: 'https://cupcasa.com/portal/dashboard',
        },
      });

      if (error) {
        showMsg(error.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
        return;
      }

      // Email confirmation disabled → session returned immediately
      if (data.session) {
        await ensureCustomer(data.user, { name, business_name: businessName });
        window.location.replace('/portal/dashboard');
      } else {
        showMsg(
          'Account created! Check your email to confirm your address, then sign in.',
          'success'
        );
      }
    });
  </script>
</body>
</html>
